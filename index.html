<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F7F8C">
  <title>Diario SPA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2026.10.14">
  <script type="module" src="js/app.js?v=2026.10.14"></script>
</head>
<body>
  <div id="demo-banner" class="banner" hidden>
    <strong>Modalità demo</strong> — Supabase non è configurato (<code>js/config.js</code>) oppure l'indirizzo
    contiene <code>?demo</code>: i dati sono di esempio e restano solo fino al ricaricamento della pagina.
  </div>

  <p id="boot" class="boot">Caricamento…</p>

  <section id="login-view" class="login-view" hidden>
    <div class="panel login-card">
      <h1>🛁 Diario SPA</h1>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" name="email" required autocomplete="username">
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" required autocomplete="current-password">
        </div>
        <p class="error" id="login-error" role="alert"></p>
        <div class="actions"><button type="submit">Accedi</button></div>
      </form>
      <p class="note"><a href="guida.html" target="_blank" rel="noopener">Guida all'uso dell'app</a></p>
    </div>
  </section>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="in">
        <span class="brand">🛁 Diario SPA</span>
        <span class="who" id="who"></span>
        <a href="guida.html" target="_blank" rel="noopener">Guida</a>
        <button class="linkish" id="btn-password" type="button" hidden>Password</button>
        <button class="linkish" id="btn-logout" type="button">Esci</button>
      </div>
    </header>
    <main id="view"></main>
    <nav id="nav" aria-label="Sezioni"><div class="in" id="nav-in"></div></nav>
  </div>

  <dialog id="password-dialog" class="panel">
    <form id="password-form">
      <h2>Cambia password</h2>
      <label for="pw1">Nuova password</label>
      <input id="pw1" type="password" name="pw1" required minlength="8" autocomplete="new-password">
      <div class="field">
        <label for="pw2">Ripeti la password</label>
        <input id="pw2" type="password" name="pw2" required minlength="8" autocomplete="new-password">
      </div>
      <p class="note">Almeno 8 caratteri.</p>
      <p class="error" id="password-error" role="alert"></p>
      <div class="actions">
        <button type="submit">Salva</button>
        <button type="button" class="ghost" id="btn-password-cancel">Annulla</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
